    <!-- Defensive code: Prevent browser extension errors from breaking the app -->
    <script>
      // Browser extensions often try to access global properties that don't exist
      // This script catches errors from extension scripts to prevent app breakage
      (function() {
        'use strict';
        
        // Catch global errors from third-party scripts (extensions)
        window.addEventListener('error', function(e) {
          // Ignore errors from known extension scripts
          var source = e.filename || '';
          if (source.includes('extension') || source.includes('chrome-extension') || source.includes('moz-extension')) {
            e.preventDefault();
            console.warn('Blocked extension error:', e.message);
            return true;
          }
        }, true);
        
        // Catch unhandled promise rejections from extensions
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (reason && reason.message && reason.message.includes('feature_flags')) {
            e.preventDefault();
            console.warn('Blocked extension promise rejection for feature_flags');
          }
        }, true);
      })();
    </script>
