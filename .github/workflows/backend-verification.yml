name: Backend Verification

'on':
  push:
    branches:
      - 'service-writer-clean-foundation'
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build verification must not require production credentials.
      # Runtime boundaries fail closed when these values are absent.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate lockfile from the authoritative package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Fail when the committed lockfile is stale
        run: git diff --exit-code -- package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Verify browser/server architecture boundaries
        run: npm run verify:boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
