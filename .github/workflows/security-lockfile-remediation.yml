name: Dependency lockfile remediation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'Run dependency lockfile remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Generate audited lockfile
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit
          git diff --check

      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Apply npm audit lockfile remediation'
          git push origin HEAD:main
